; Revision 7.0 — ESP32-S3-WROOM-1-N8R8 gimbal controller
; Output path matches simulation/wokwi.toml (firmware/.pio/build/esp32-s3-devkitc-1/).
[env:esp32-s3-devkitc-1]
; SimpleFOC >= 2.3.4 requires Arduino-ESP32 3.x / ESP-IDF 5.x (MCPWM prelude API);
; the official espressif32@6.x platform is still core 2.0.x, so use pioarduino.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi   ; N8R8: quad flash + octal PSRAM (GPIO33-37 reserved)
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_deps =
    askuric/Simple FOC@2.3.4
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1               ; console on native USB (GPIO19/20), UART0 left for boot log
    -DARDUINO_RUNNING_CORE=1                  ; loop()/FOC on core 1, encoder task on core 0
    -Wall
